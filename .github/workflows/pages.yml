name: Publicar no GitHub Pages

# Monta o site estático (jogo + Three.js) e publica na branch gh-pages.
# Em Settings → Pages, a fonte deve ser "Deploy from a branch" → gh-pages / (root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Montar o site estático
        run: |
          mkdir -p _site/vendor/three/examples
          cp index.html config.js _site/
          cp -r client shared _site/
          cp -r node_modules/three/build _site/vendor/three/build
          cp -r node_modules/three/examples/jsm _site/vendor/three/examples/jsm
          touch _site/.nojekyll
      - name: Publicar na branch gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
